<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Beavers Age Checker</title>
<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#2E7D5B" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<style>
  :root { --green: #2E7D5B; --green-light: #3FA66E; --bg: #F6F7F5; --text: #1E2A24; --muted: #6B7770; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; align-items: center;
  }
  header {
    background: var(--green); color: white; width: 100%;
    padding: 16px 20px; display: flex; justify-content: space-between; align-items: center;
  }
  header h1 { font-size: 1.15rem; margin: 0; }
  #installBtn {
    background: white; color: var(--green); border: none;
    padding: 8px 14px; border-radius: 8px; font-weight: 600; display: none;
  }
  main { width: 100%; max-width: 380px; padding: 24px 20px; }
  label { font-weight: 600; display: block; margin-bottom: 12px; }

  .wheels {
    position: relative;
    display: flex;
    gap: 8px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    height: 180px;
    overflow: hidden;
  }
  .wheel-col {
    flex: 1;
    overflow-y: scroll;
    scroll-snap-type: y mandatory;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .wheel-col::-webkit-scrollbar { display: none; }
  .wheel-item {
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    scroll-snap-align: center;
    font-size: 1.1rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .wheel-item.selected { color: var(--text); font-weight: 700; font-size: 1.25rem; }
  .wheel-highlight {
    position: absolute;
    top: 68px; height: 44px; left: 0; right: 0;
    border-top: 1px solid #ddd; border-bottom: 1px solid #ddd;
    pointer-events: none;
  }
  .wheel-fade-top, .wheel-fade-bottom {
    position: absolute; left: 0; right: 0; height: 68px; pointer-events: none; z-index: 2;
  }
  .wheel-fade-top { top: 0; background: linear-gradient(white, rgba(255,255,255,0)); }
  .wheel-fade-bottom { bottom: 0; background: linear-gradient(rgba(255,255,255,0), white); }

  #result {
    margin-top: 24px; padding: 20px; border-radius: 12px;
    background: white; box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    text-align: center;
  }
  #result .verdict { font-size: 1.6rem; font-weight: 700; }
  #result.yes .verdict { color: var(--green); }
  #result.no .verdict { color: #C97F1E; }
  #result .detail { margin-top: 8px; color: var(--muted); }
  #result .age { margin-top: 14px; padding-top: 14px; border-top: 1px solid #eee; }
  #result .age .age-label { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  #result .age .age-value { font-size: 1.15rem; font-weight: 600; margin-top: 4px; }
</style>
</head>
<body>

<header>
  <h1>🦫 Beavers Age Checker</h1>
  <button id="installBtn">Install app</button>
</header>

<main>
  <label>Date of birth</label>

  <div class="wheels">
    <div class="wheel-col" id="dayCol"></div>
    <div class="wheel-col" id="monthCol"></div>
    <div class="wheel-col" id="yearCol"></div>
    <div class="wheel-highlight"></div>
    <div class="wheel-fade-top"></div>
    <div class="wheel-fade-bottom"></div>
  </div>

  <div id="result">
    <div class="verdict" id="verdict">—</div>
    <div class="detail" id="detail">Scroll the wheels to set a date of birth</div>
    <div class="age">
      <div class="age-label">Age today</div>
      <div class="age-value" id="ageValue">—</div>
    </div>
  </div>
</main>

<script>
const ITEM_H = 44;
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const YEARS = [];
for (let y = 2015; y <= new Date().getFullYear() + 1; y++) YEARS.push(y);

function buildWheel(colEl, items, defaultIndex) {
  colEl.style.paddingTop = "68px";
  colEl.style.paddingBottom = "68px";
  items.forEach((label) => {
    const div = document.createElement("div");
    div.className = "wheel-item";
    div.textContent = label;
    colEl.appendChild(div);
  });
  colEl.scrollTop = defaultIndex * ITEM_H;
}

const dayCol = document.getElementById("dayCol");
const monthCol = document.getElementById("monthCol");
const yearCol = document.getElementById("yearCol");

const days = Array.from({length: 31}, (_, i) => i + 1);
buildWheel(dayCol, days, 0);
buildWheel(monthCol, MONTHS, 0);
const defaultYearIndex = YEARS.indexOf(2021);
buildWheel(yearCol, YEARS, defaultYearIndex >= 0 ? defaultYearIndex : 0);

function getSelectedIndex(colEl) {
  return Math.round(colEl.scrollTop / ITEM_H);
}

function markSelected(colEl, items) {
  const idx = Math.min(items.length - 1, Math.max(0, getSelectedIndex(colEl)));
  [...colEl.children].forEach((child, i) => {
    child.classList.toggle("selected", i === idx);
  });
  return idx;
}

function addYearsMonths(date, years, months) {
  // Calendar-month arithmetic: same day number, but if that day doesn't exist
  // in the target month (e.g. 31st into a 28-day February), use the month's last day.
  const total = date.getMonth() + months;
  const targetYear = date.getFullYear() + years + Math.floor(total / 12);
  const targetMonth = ((total % 12) + 12) % 12;
  const lastDay = new Date(targetYear, targetMonth + 1, 0).getDate();
  return new Date(targetYear, targetMonth, Math.min(date.getDate(), lastDay));
}
function formatDate(d) {
  return d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
}

function plural(n, word) {
  return `${n} ${word}${n === 1 ? "" : "s"}`;
}

function ageBetween(dob, today) {
  let years = today.getFullYear() - dob.getFullYear();
  let months = today.getMonth() - dob.getMonth();
  let days = today.getDate() - dob.getDate();

  if (days < 0) {
    months--;
    // borrow the length of the month before today's month
    days += new Date(today.getFullYear(), today.getMonth(), 0).getDate();
  }
  if (months < 0) {
    years--;
    months += 12;
  }
  return { years, months, days };
}

function recalc() {
  const dIdx = markSelected(dayCol, days);
  const mIdx = markSelected(monthCol, MONTHS);
  const yIdx = markSelected(yearCol, YEARS);

  const day = days[dIdx];
  const month = mIdx;
  const year = YEARS[yIdx];

  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const safeDay = Math.min(day, daysInMonth);

  const dob = new Date(year, month, safeDay);
  const eligibleDate = addYearsMonths(dob, 5, 9);
  const today = new Date(); today.setHours(0,0,0,0);
  const isEligible = eligibleDate <= today;

  const resultEl = document.getElementById("result");
  resultEl.className = isEligible ? "yes" : "no";
  document.getElementById("verdict").textContent = isEligible ? "Yes" : "No";
  document.getElementById("detail").textContent = isEligible
    ? `Eligible since ${formatDate(eligibleDate)}`
    : `Eligible from ${formatDate(eligibleDate)}`;

  const ageEl = document.getElementById("ageValue");
  if (dob > today) {
    ageEl.textContent = "Not born yet";
  } else {
    const a = ageBetween(dob, today);
    ageEl.textContent = `${plural(a.years, "year")}, ${plural(a.months, "month")}, ${plural(a.days, "day")}`;
  }
}

let scrollTimeout;
[dayCol, monthCol, yearCol].forEach((col) => {
  col.addEventListener("scroll", () => {
    clearTimeout(scrollTimeout);
    scrollTimeout = setTimeout(recalc, 80);
  });
});

recalc();

let deferredPrompt;
const installBtn = document.getElementById("installBtn");
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredPrompt = e;
  installBtn.style.display = "inline-block";
});
installBtn.addEventListener("click", async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  installBtn.style.display = "none";
});

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js"));
}
</script>
</body>
</html>
