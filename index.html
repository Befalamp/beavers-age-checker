<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Beavers Age Checker</title>
<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#2E7D5B" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<style>
  :root { --green: #2E7D5B; --green-light: #3FA66E; --bg: #F6F7F5; --text: #1E2A24; --muted: #6B7770; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; align-items: center;
  }
  header {
    background: var(--green); color: white; width: 100%;
    padding: 16px 20px; display: flex; justify-content: space-between; align-items: center;
  }
  header h1 { font-size: 1.15rem; margin: 0; }
  #installBtn {
    background: white; color: var(--green); border: none;
    padding: 8px 14px; border-radius: 8px; font-weight: 600; display: none;
  }
  main { width: 100%; max-width: 380px; padding: 24px 20px; }
  label { font-weight: 600; display: block; margin-bottom: 8px; }
  input[type=date] {
    width: 100%; padding: 12px; font-size: 1.1rem;
    border: 1px solid #ccc; border-radius: 8px;
  }
  #result {
    margin-top: 24px; padding: 20px; border-radius: 12px;
    background: white; box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    text-align: center; display: none;
  }
  #result .verdict { font-size: 1.6rem; font-weight: 700; }
  #result.yes .verdict { color: var(--green); }
  #result.no .verdict { color: #C97F1E; }
  #result .detail { margin-top: 8px; color: var(--muted); }
</style>
</head>
<body>

<header>
  <h1>🦫 Beavers Age Checker</h1>
  <button id="installBtn">Install app</button>
</header>

<main>
  <label for="dob">Date of birth</label>
  <input type="date" id="dob" />
  <div id="result">
    <div class="verdict" id="verdict"></div>
    <div class="detail" id="detail"></div>
  </div>
</main>

<script>
function addYearsMonths(date, years, months) {
  const d = new Date(date);
  d.setFullYear(d.getFullYear() + years);
  d.setMonth(d.getMonth() + months);
  return d;
}
function formatDate(d) {
  return d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
}

document.getElementById("dob").addEventListener("change", (e) => {
  const val = e.target.value;
  const resultEl = document.getElementById("result");
  if (!val) { resultEl.style.display = "none"; return; }

  const dob = new Date(val + "T00:00:00");
  const eligibleDate = addYearsMonths(dob, 5, 9);
  const today = new Date(); today.setHours(0,0,0,0);
  const isEligible = eligibleDate <= today;

  resultEl.style.display = "block";
  resultEl.className = isEligible ? "yes" : "no";
  document.getElementById("verdict").textContent = isEligible ? "Yes" : "No";
  document.getElementById("detail").textContent = isEligible
    ? `Eligible since ${formatDate(eligibleDate)}`
    : `Eligible from ${formatDate(eligibleDate)}`;
});

// Install prompt
let deferredPrompt;
const installBtn = document.getElementById("installBtn");
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredPrompt = e;
  installBtn.style.display = "inline-block";
});
installBtn.addEventListener("click", async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  installBtn.style.display = "none";
});

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js"));
}
</script>
</body>
</html>
